<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pet Care</title>
    <!-- Bootstrap CSS for quick styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">🐾 Smart Pet Care</a>
        <div class="navbar-nav ms-auto">
            {% if current_user.is_authenticated %}
                <span class="nav-item nav-link text-info">Hello, {{ current_user.username }}!</span>
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('add_pet') }}">Add Pet</a>
                <a class="nav-link text-danger" href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                <a class="nav-link btn btn-primary text-white ms-2" href="{{ url_for('register') }}">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    <!-- This is where individual page content will be injected -->
    {% block content %}{% endblock %}
</div>

</body>
</html>
